spring:
  config:
    import: file:.env[.properties]
  application:
    name: ecommerce
  datasource:
    url: jdbc:mysql://localhost:3306/ecomerse_db?createDatabaseIfNotExist=true
    username: root
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
